services:
  db:
    image: pgvector/pgvector:pg17   # PostgreSQL 17 + pgvector (RDS for PostgreSQL 17 includes it too)
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      - "5433:5432"   # host 5433, to avoid clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://notes:notes@db:5432/notes
      RUN_MIGRATIONS_ON_STARTUP: "false"   # the migrate service below does it, like the ECS one-off task
    ports:
      - "8000:8000"
    read_only: true                        # same as production: nothing writes to the image
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: postgresql://notes:notes@db:5432/notes
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
